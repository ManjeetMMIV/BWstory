name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.gitignore'

jobs:
  build-apk:
    name: Build Standalone Android APK
    runs-on: ubuntu-latest

    env:
      NODE_OPTIONS: '--max-old-space-size=4096'

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: ☕ Setup Java JDK (v17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🤖 Setup Android SDK Environment
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV

      - name: 📦 Install Node dependencies
        run: npm ci

      - name: ⚙️ Generate Android native project (Expo Prebuild)
        run: npx expo prebuild --platform android --clean

      - name: 🔧 Patch build.gradle for CI (debug-signed release, no minification)
        run: |
          node -e "
          const fs = require('fs');
          const file = 'android/app/build.gradle';
          let content = fs.readFileSync(file, 'utf8');
          
          // Disable minification
          content = content.replace(/minifyEnabled\s+true/g, 'minifyEnabled false');
          content = content.replace(/shrinkResources\s+true/g, 'shrinkResources false');
          
          // Add debug signing to release block
          content = content.replace(
            /release\s*\{/,
            'release {\n            signingConfig signingConfigs.debug'
          );
          
          fs.writeFileSync(file, content);
          console.log('✅ Patched build.gradle successfully');
          "

      - name: 🔑 Grant execute permissions to gradlew
        run: chmod +x android/gradlew

      - name: 🔨 Compile Standalone Release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon -x lint

      - name: 🔍 Locate generated APK
        id: find_apk
        run: |
          APK_PATH=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
          echo "Found APK at: $APK_PATH"
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT

      - name: 📤 Upload APK Artifact to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: BWStory-Standalone-APK
          path: ${{ steps.find_apk.outputs.apk_path }}
          retention-days: 14
